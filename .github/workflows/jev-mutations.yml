# The Ask Jev panel's mutation proof (apps/map/scripts/jev-mutations.sh), run
# on every pull request that touches the panel's code or its tests. Each break
# in apps/map/scripts/jev-mutate.mjs is applied in turn, the Jev tests run, and
# the file is restored with git checkout. The per-break table goes to the job
# summary. The job fails if the unbroken baseline fails, if a break can't be
# applied (its anchor moved), or if any break survives.
#
# Install is the same as map-ci's check job: npm ci --ignore-scripts, then
# scripts/patch-knockout-csp.mjs. Read-only: no secrets, nothing pushed.
name: jev-mutations

on:
  pull_request:
    paths:
      - "apps/map/lib/jev/**"
      - "apps/map/components/hud/Jev*"
      - "apps/map/components/hud/AskJev*"
      - "apps/map/scripts/jev-mutate.mjs"
      - "apps/map/scripts/jev-mutations.sh"
      - ".github/workflows/jev-mutations.yml"
      # A test-runner or dependency bump can change what kills a mutant (vitest 3 -> 5
      # in #46 never ran here), so those run it too.
      - "apps/map/package.json"
      - "apps/map/package-lock.json"
      - "apps/map/vitest.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-mutations-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/map

jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/map/package-lock.json

      - run: npm ci --ignore-scripts

      - run: node scripts/patch-knockout-csp.mjs

      - name: mutation proof
        env:
          JEV_MUT_OUT: ${{ runner.temp }}/jev-mutations.md
          JEV_MUT_LOGS: ${{ runner.temp }}/jev-mutations-logs
        run: bash scripts/jev-mutations.sh

      - name: job summary
        if: always()
        env:
          JEV_MUT_OUT: ${{ runner.temp }}/jev-mutations.md
        run: |
          if [ -f "$JEV_MUT_OUT" ]; then cat "$JEV_MUT_OUT" >> "$GITHUB_STEP_SUMMARY"; else echo "No mutation table was written." >> "$GITHUB_STEP_SUMMARY"; fi
