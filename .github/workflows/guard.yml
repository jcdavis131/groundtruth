# The README's rules as a check on every pull request and push to master:
# no big files or weights, no .env, LF only, no token-shaped strings, no
# internal machine paths. Plain Node, no install, a few seconds. It binds a
# merge once "guard" is a required check in branch protection.
name: guard

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: guard self-test
        run: node scripts/guard.test.mjs
      - name: git-guard hook self-test
        run: node scripts/hooks/git-guard.test.mjs
      - name: worktree-remove self-test
        run: node scripts/worktree-remove.test.mjs
      - name: guard
        run: node scripts/guard.mjs
