# The map app's checks (apps/map, imported from gods-eye-view), run on every
# pull request and push to master that touches apps/map: the collections
# freeze check first (plain Node, no install, a second), then tsc --noEmit,
# vitest and eslint on the files the pull request changed, and a reporting-only
# receipt coverage table (see the step). Every step runs in apps/map, the same
# as it did at eye's repo root.
#
# Install is npm ci --ignore-scripts, then only the half of postinstall the
# tests read: scripts/patch-knockout-csp.mjs, which security-headers.test.ts
# checks. scripts/copy-cesium.mjs fills public/cesium for the browser and no
# test needs it.
#
# The freeze check (apps/map/scripts/freeze-check.mjs) fails while
# apps/map/FREEZE.json's date has not passed and lib/catalog/collections.ts
# holds more collections than its cap. It binds a merge only once the check
# is marked required in branch protection. Read-only: it needs no secrets and
# writes nothing.
name: map-ci

on:
  pull_request:
    paths:
      - "apps/map/**"
      - ".github/workflows/map-ci.yml"
  push:
    branches: [master]
    paths:
      - "apps/map/**"
      - ".github/workflows/map-ci.yml"

permissions:
  contents: read

# One run per ref; a new push to a pull request cancels its older run, a push
# to master never cancels.
concurrency:
  group: map-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/map

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: node scripts/freeze-check.mjs

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Enough history to diff a pull request against its base for eslint.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/map/package-lock.json

      - run: npm ci --ignore-scripts

      - run: node scripts/patch-knockout-csp.mjs

      - name: tsc
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run

      # Receipt coverage (apps/map/scripts/receipt-coverage.mjs): of the valued lines in the twelve recorded
      # world_context fixtures, how many carry publisher + upstreamRecordUrl + retrievedAt. Prints n/N per fixture,
      # the total and the uncovered lines by source. Reporting only, never gating: the exit code is 0 whatever the
      # number is. When the total reaches 95 percent, add `--min 95` here to gate. What is counted is in
      # apps/map/docs/MCP.md, "Receipt coverage". It runs even when an earlier step failed, so the number is
      # printed on every pull request; a crash of the script itself still fails the job. Needs the zod that
      # npm ci installed, and Node 22.18+ (setup-node above resolves 22 to the newest 22.x).
      - name: receipt coverage
        if: ${{ !cancelled() }}
        run: node scripts/receipt-coverage.mjs

      # Changed files only, on every pull request: cheap, and it holds new code to
      # the rules. The whole-app run below covers changes that touch no source.
      # --relative keeps the paths relative to apps/map, where eslint runs.
      - name: eslint (changed files)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --relative --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' | grep -v '^public/' || true)
          if [ -z "$files" ]; then echo "No changed source files to lint."; exit 0; fi
          echo "$files"
          echo "$files" | xargs npx eslint

      # A dependency or lint-config change can change what eslint says about code
      # nobody touched; eslint 9 -> 10 (#44) was never linted, because the step
      # above saw no changed source files. The whole app has linted clean since
      # lint/zero (2026-10-19; it was 14 problems in #49's run), so this gates,
      # warnings included (--max-warnings 0).
      # public/ is skipped as above.
      - name: eslint (whole app, on dependency or CI changes)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- package.json package-lock.json 'eslint.config.*' ':/.github/workflows/map-ci.yml'; then echo "No dependency, lint-config or workflow change."; exit 0; fi
          npx eslint . --ignore-pattern 'public/**' --max-warnings 0
